[project]
name = "verabank-bi"
version = "0.1.0"
description = "BI de VeraBank: crea por API la conexión, las tarjetas de KPIs y el dashboard de Metabase (D9)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "respx>=0.22",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
