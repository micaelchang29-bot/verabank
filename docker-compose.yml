# Infraestructura local de VeraBank. Perfiles:
#   core  PostgreSQL y Kafka (make up-core arranca además transfer-service en el host, con scoring stub)
#   risk  risk-scoring, risk-stream y transfer-service en Compose con scoring remoto (make up)
#   sim   rail interbancario simulado (make up)
# Las credenciales viven en .env (ver .env.example).
name: verabank

services:
  postgres:
    image: postgres:16.16
    profiles: [core, risk, sim]
    mem_limit: 1g
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?define POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      VERABANK_TRANSFER_PASSWORD: ${VERABANK_TRANSFER_PASSWORD:?define VERABANK_TRANSFER_PASSWORD en .env}
      VERABANK_RISK_PASSWORD: ${VERABANK_RISK_PASSWORD:?define VERABANK_RISK_PASSWORD en .env}
      VERABANK_BI_PASSWORD: ${VERABANK_BI_PASSWORD:?define VERABANK_BI_PASSWORD en .env}
      RISK_SVC_PASSWORD: ${RISK_SVC_PASSWORD:?define RISK_SVC_PASSWORD en .env}
      SIM_LOADER_PASSWORD: ${SIM_LOADER_PASSWORD:?define SIM_LOADER_PASSWORD en .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init/initdb.d:/docker-entrypoint-initdb.d:ro
      - ./db/init/roles.sql:/sql/roles.sql:ro
      - ./db/init/roles_runtime.sql:/sql/roles_runtime.sql:ro
    healthcheck:
      # Por TCP: durante la inicialización el servidor temporal solo escucha en socket unix.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  kafka:
    image: apache/kafka:4.3.2
    profiles: [core, risk, sim]
    mem_limit: 1g
    restart: unless-stopped
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?define KAFKA_CLUSTER_ID en .env}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # los tópicos los crea kafka-init
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:${KAFKA_EXTERNAL_PORT:-29092}:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    # Un solo uso: crea los tópicos de §3.1 y termina.
    image: apache/kafka:4.3.2
    profiles: [core, risk, sim]
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    environment:
      BOOTSTRAP_SERVER: kafka:9092
    volumes:
      - ./deploy/kafka/create-topics.sh:/scripts/create-topics.sh:ro

  # --- perfil risk: una imagen de risk-service, dos despliegues (ADR-08, D3) ---
  risk-scoring:
    build:
      context: .
      dockerfile: risk-service/Dockerfile
    image: verabank/risk-service:dev
    profiles: [risk]
    restart: unless-stopped
    mem_limit: 768m
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      VERABANK_ROLE: scoring
      SERVER_PORT: "8081"
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:?define POSTGRES_DB en .env}
      RISK_SVC_PASSWORD: ${RISK_SVC_PASSWORD:?define RISK_SVC_PASSWORD en .env}
      VERABANK_SCORING_POOL_SIZE: ${VERABANK_SCORING_POOL_SIZE:-10}
      JAVA_OPTS: -Xms256m -Xmx256m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=64m -XX:MaxDirectMemorySize=64m -XX:+ExitOnOutOfMemoryError
    ports:
      # 8081 del host es de transfer-service; el scoring se publica aparte (k6 y diagnóstico).
      - "127.0.0.1:${RISK_SCORING_PORT:-8083}:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/q/health/ready > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s

  risk-stream:
    image: verabank/risk-service:dev
    profiles: [risk]
    restart: unless-stopped
    mem_limit: 640m
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
    environment:
      VERABANK_ROLE: stream
      SERVER_PORT: "8082"
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:?define POSTGRES_DB en .env}
      RISK_SVC_PASSWORD: ${RISK_SVC_PASSWORD:?define RISK_SVC_PASSWORD en .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      VERABANK_API_KEYS: ${VERABANK_API_KEYS:-}
      JAVA_OPTS: -Xms128m -Xmx256m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=64m -XX:MaxDirectMemorySize=64m -XX:+ExitOnOutOfMemoryError
    ports:
      - "127.0.0.1:${RISK_STREAM_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/q/health/ready > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s

  # Con scoring remoto. No espera a risk-scoring: sus migraciones de core crean lo que risk necesita, y si el
  # scoring no responde decide el fallback por monto (ADR-04).
  transfer-service:
    build:
      context: .
      dockerfile: transfer-service/Dockerfile
    image: verabank/transfer-service:dev
    profiles: [risk]
    restart: unless-stopped
    mem_limit: 768m
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
    environment:
      VERABANK_SCORING_MODE: remote
      RISK_SERVICE_URL: http://risk-scoring:8081
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:?define POSTGRES_DB en .env}
      VERABANK_TRANSFER_PASSWORD: ${VERABANK_TRANSFER_PASSWORD:?define VERABANK_TRANSFER_PASSWORD en .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      VERABANK_API_KEYS: ${VERABANK_API_KEYS:-}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health/readiness > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 20s

  # --- perfil sim ---
  rail-sim:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    image: verabank/rail-sim:dev
    profiles: [sim]
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      kafka: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
    command: ["--bootstrap-servers", "kafka:9092", "--reject-rate", "${RAIL_REJECT_RATE:-0}", "--delay-ms", "${RAIL_DELAY_MS:-20:200}"]
    volumes:
      - rail-state:/state

volumes:
  postgres-data:
  kafka-data:
  rail-state:
