[project]
name = "verabank-db-tests"
version = "0.1.0"
description = "Pruebas de db/: migraciones, roles, permisos, auditoría y semillas sobre un PostgreSQL desechable"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.2",
    "psycopg[binary]>=3.2",
    "pycountry>=24.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
