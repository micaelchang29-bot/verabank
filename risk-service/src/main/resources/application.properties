quarkus.application.name=risk-service
quarkus.http.port=${SERVER_PORT:8082}
quarkus.http.host=0.0.0.0

# --- Rol (D3): una imagen, el rol se elige en tiempo de ejecución con VERABANK_ROLE=scoring|stream ---
verabank.role=${VERABANK_ROLE:scoring}
# Sombra (D8): puntúa también el challenger y guarda shadow_score. Nunca cambia la respuesta.
verabank.shadow.enabled=${VERABANK_SHADOW_ENABLED:false}
# Tiempo máximo por consulta a PostgreSQL.
verabank.scoring.query-timeout=${VERABANK_QUERY_TIMEOUT:100ms}
# Directorio de artefactos; sin valor se leen del classpath (artifacts/, de ml/artifacts al compilar).
# verabank.artifacts.dir=

# --- PostgreSQL: pool reactivo dedicado al scoring, con el rol de ejecución risk_svc (db/README.md) ---
quarkus.datasource."scoring".db-kind=postgresql
quarkus.datasource."scoring".username=${VERABANK_DB_USER:risk_svc}
quarkus.datasource."scoring".password=${RISK_SVC_PASSWORD:}
quarkus.datasource."scoring".reactive.url=postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:verabank}
quarkus.datasource."scoring".reactive.max-size=${VERABANK_SCORING_POOL_SIZE:10}
quarkus.datasource."scoring".reactive.idle-timeout=PT5M
# La disponibilidad la decide ScoringReadiness (modelo + base), no la comprobación genérica.
quarkus.datasource.health.enabled=false

# --- Métricas y salud ---
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.smallrye-health.root-path=/q/health

quarkus.log.console.format=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5p [%c{1.}] %s%e%n

# Las pruebas arrancan solo con el PostgreSQL de Testcontainers que registra PostgresResource.
%test.quarkus.devservices.enabled=false
%test.quarkus.http.test-port=0
