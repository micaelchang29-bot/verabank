quarkus.application.name=risk-service
quarkus.http.port=${SERVER_PORT:8082}
quarkus.http.host=0.0.0.0

# --- Rol (D3): una imagen, el rol se elige en tiempo de ejecución con VERABANK_ROLE=scoring|stream ---
verabank.role=${VERABANK_ROLE:scoring}
# Sombra (D8): puntúa también el challenger y guarda shadow_score. Nunca cambia la respuesta.
verabank.shadow.enabled=${VERABANK_SHADOW_ENABLED:false}
# Tiempo máximo por consulta a PostgreSQL.
verabank.scoring.query-timeout=${VERABANK_QUERY_TIMEOUT:100ms}
# Directorio de artefactos; sin valor se leen del classpath (artifacts/, de ml/artifacts al compilar).
# verabank.artifacts.dir=

# --- PostgreSQL: pool reactivo dedicado al scoring, con el rol de ejecución risk_svc (db/README.md) ---
quarkus.datasource."scoring".db-kind=postgresql
quarkus.datasource."scoring".username=${VERABANK_DB_USER:risk_svc}
quarkus.datasource."scoring".password=${RISK_SVC_PASSWORD:}
quarkus.datasource."scoring".reactive.url=postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:verabank}
quarkus.datasource."scoring".reactive.max-size=${VERABANK_SCORING_POOL_SIZE:10}
# El pool reactivo de Vert.x no tiene tamaño mínimo: ScoringStartup abre las max-size conexiones al arrancar y, sin
# caducidad por inactividad (PT0S), se quedan abiertas; así ninguna solicitud paga un alta dentro de su límite de 100 ms.
quarkus.datasource."scoring".reactive.idle-timeout=PT0S
# La disponibilidad la decide ScoringReadiness (modelo + base), no la comprobación genérica.
quarkus.datasource.health.enabled=false

# --- Métricas y salud ---
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.smallrye-health.root-path=/q/health

quarkus.log.console.format=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5p [%c{1.}] %s%e%n

# Las pruebas arrancan solo con el PostgreSQL de Testcontainers que registra PostgresResource.
%test.quarkus.devservices.enabled=false
%test.quarkus.http.test-port=0

# --- Rol stream: PostgreSQL (pool reactivo propio, mismo rol de ejecución risk_svc) ---
quarkus.datasource."stream".db-kind=postgresql
quarkus.datasource."stream".username=${VERABANK_DB_USER:risk_svc}
quarkus.datasource."stream".password=${RISK_SVC_PASSWORD:}
quarkus.datasource."stream".reactive.url=postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:verabank}
quarkus.datasource."stream".reactive.max-size=${VERABANK_STREAM_POOL_SIZE:10}
quarkus.datasource."stream".reactive.idle-timeout=PT5M

# --- Rol stream: Kafka. Los canales solo se abren con VERABANK_ROLE=stream (verabank.stream.enabled lo deriva) ---
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
verabank.stream.retries=${VERABANK_STREAM_RETRIES:3}
verabank.stream.retry-backoff=${VERABANK_STREAM_RETRY_BACKOFF:1s}
verabank.stream.rules-refresh=${VERABANK_RULES_REFRESH:60s}
# Claves de la API de alertas (canal:clave,canal:clave); obligatorias con el rol stream.
verabank.api-keys=${VERABANK_API_KEYS:}

# El `enabled` de cada canal lo deriva del rol StreamEnabledInterceptor (scoring no abre consumidores).
# Commit manual: el offset solo se confirma al reconocer el mensaje, después de confirmar la transacción local.
mp.messaging.incoming.transfer-events.connector=smallrye-kafka
mp.messaging.incoming.transfer-events.topic=${verabank.stream.transfer-events-topic}
mp.messaging.incoming.transfer-events.group.id=risk-stream
mp.messaging.incoming.transfer-events.enable.auto.commit=false
mp.messaging.incoming.transfer-events.auto.offset.reset=earliest
mp.messaging.incoming.transfer-events.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.transfer-events.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.transfer-events.commit-strategy=throttled
mp.messaging.incoming.transfer-events.failure-strategy=fail

mp.messaging.incoming.fraud-labels.connector=smallrye-kafka
mp.messaging.incoming.fraud-labels.topic=${verabank.stream.fraud-labels-topic}
mp.messaging.incoming.fraud-labels.group.id=risk-stream-labels
mp.messaging.incoming.fraud-labels.enable.auto.commit=false
mp.messaging.incoming.fraud-labels.auto.offset.reset=earliest
mp.messaging.incoming.fraud-labels.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.fraud-labels.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.fraud-labels.commit-strategy=throttled
mp.messaging.incoming.fraud-labels.failure-strategy=fail
