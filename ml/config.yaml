# Parámetros del pipeline de ML (docs/diseno.md §5b y §5c). Solo valores: la lógica vive en src/.

# Tipos de transferencia que entran al modelo (contracts/features.yaml, feature `type`).
# PaySim también trae CASH_IN, que queda fuera del dominio.
types: [TRANSFER, CASH_OUT, PAYMENT, DEBIT]

# Split temporal por `step` (1 paso = 1 hora), intervalos cerrados. Los pasos entre una partición y la
# siguiente no se usan (hueco de gap_steps: imita el retraso de las etiquetas).
split:
  train: [1, 400]
  valid: [425, 550]
  test: [575, 744]
  gap_steps: 24

# Instante del paso 1 (UTC). occurred_at = sim_epoch + (step - 1) horas. Lo usan el golden y el replay.
sim_epoch: "2026-01-01T00:00:00Z"

# Costo de negocio: C = Σ monto(fraude aprobado) + review·n(REVIEW) + block_false_positive·n(legítimas bloqueadas).
# Los costos unitarios son supuestos; se reporta la sensibilidad de ±sensitivity (fracción).
costs:
  review: 3
  block_false_positive: 15
  sensitivity: 0.5

# Recall se mide con la tasa de falsos positivos fija en estos valores (0,5 % y 0,1 %).
fpr_targets: [0.005, 0.001]
# t_block: menor umbral con FPR de bloqueo <= block_fpr_max (0,05 %).
block_fpr_max: 0.0005
# t_review: minimiza el costo con tasa de revisión <= review_rate_max (0,5 %, capacidad de analistas).
review_rate_max: 0.005

# Intervalos por bootstrap de bloques de pasos (24 pasos = un día).
bootstrap:
  block_steps: 24
  sensitivity_block_steps: 6   # análisis de sensibilidad con bloques de 6 horas
  n_resamples: 1000
  confidence: 0.95            # intervalos percentil
  min_blocks: 10              # con menos bloques el intervalo no es concluyente

# Selección de modelo (§5d).
selection:
  min_pr_auc_gain: 0.02        # el modelo más complejo gana solo si mejora el PR-AUC en al menos esto
  max_inference_p95_ms: 10     # latencia p95 de inferencia admisible

seed: 42

# Decimales de los scores antes de comparar con un umbral (igual que hará el servicio).
rounding_decimals: 5

# Modelos del conjunto A (§5d). Cada combinación de la rejilla es una ejecución hija de MLflow.
models:
  logreg:                        # Pipeline(StandardScaler, LogisticRegression(class_weight="balanced"))
    C: [0.01, 0.1, 1.0, 10.0]
    max_iter: 300
  xgb:                           # tree_method=hist, eval_metric=aucpr, parada temprana contra valid
    max_depth: [4, 5, 6]
    scale_pos_weight: [1, 30, 300]   # 1 = sin peso; 30 ≈ √(neg/pos); 300 ≈ 0,3·(neg/pos)
    n_estimators: 400            # máximo de árboles
    learning_rate: 0.1
    early_stopping_rounds: 30
    n_jobs: 8

# Latencia de inferencia con ONNX Runtime: un hilo, una fila por llamada.
latency:
  calls: 10000
  warmup: 1000

# golden.jsonl (T-13): casos de valid con los que Java debe recalcular features y score.
# Composición: boundary (por cada umbral y por cada lado, medido con el score redondeado a 5 decimales, los
# boundary_per_side scores distintos más cercanos: hasta 4 · boundary_per_side = 100 casos, incluidos los que el
# redondeo cambia de lado), fraud, above_review (legítimas con score >= t_review) y el resto legítimas al azar
# estratificadas por tipo (total - los demás). La distancia real de la frontera la registra
# ml/artifacts/README.md; no hay radio fijo.
golden:
  total: 1000
  fraud: 250
  above_review: 250
  boundary_per_side: 25
  max_history: 300               # filas máximas de history por caso; los candidatos con más se excluyen

mlflow:
  experiment: verabank-fraud
  tracking_db: ml/mlflow.db      # relativo a la raíz del repositorio
  registered_models: {logreg: fraud-logreg, xgb: fraud-xgb}
