# Arranque de datos, en el orden de db/README.md. Idempotentes: kind-deploy los borra y los vuelve a crear.
#   db-migrate: core y audit (verabank_transfer, como transfer-service), risk (verabank_risk), analytics (rol de
#               arranque) y permisos (db/init/grants.sql). Migraciones desde configMapGenerator.
#   bootstrap:  tópicos de §3.1 (deploy/kafka/create-topics.sh) y semillas (core, CLEARING exenta, países de riesgo y
#               base de Metabase), cuando db-migrate ya dejó los permisos.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  labels: {app: db-migrate}
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app: db-migrate}
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-postgres
          image: postgres:16.16
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do sleep 2; done"]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 128Mi}
        - name: core-audit
          image: flyway/flyway:11.7.2
          args: ["-url=jdbc:postgresql://postgres:5432/$(POSTGRES_DB)", "-user=verabank_transfer",
                 "-schemas=flyway_transfer", "-defaultSchema=flyway_transfer", "-createSchemas=true",
                 "-locations=filesystem:/flyway/sql/core,filesystem:/flyway/sql/audit", "-validateMigrationNaming=true",
                 "-connectRetries=10", "-cleanDisabled=true", "migrate"]
          env:
            - {name: POSTGRES_DB, valueFrom: {secretKeyRef: {name: verabank-env, key: POSTGRES_DB}}}
            - {name: FLYWAY_PASSWORD, valueFrom: {secretKeyRef: {name: verabank-env, key: VERABANK_TRANSFER_PASSWORD}}}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: core, mountPath: /flyway/sql/core, readOnly: true}
            - {name: audit, mountPath: /flyway/sql/audit, readOnly: true}
        - name: risk
          image: flyway/flyway:11.7.2
          args: ["-url=jdbc:postgresql://postgres:5432/$(POSTGRES_DB)", "-user=verabank_risk",
                 "-schemas=flyway_risk", "-defaultSchema=flyway_risk", "-locations=filesystem:/flyway/sql/risk",
                 "-connectRetries=10", "-cleanDisabled=true", "migrate"]
          env:
            - {name: POSTGRES_DB, valueFrom: {secretKeyRef: {name: verabank-env, key: POSTGRES_DB}}}
            - {name: FLYWAY_PASSWORD, valueFrom: {secretKeyRef: {name: verabank-env, key: VERABANK_RISK_PASSWORD}}}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: risk, mountPath: /flyway/sql/risk, readOnly: true}
        - name: analytics
          image: flyway/flyway:11.7.2
          args: ["-url=jdbc:postgresql://postgres:5432/$(POSTGRES_DB)", "-user=$(POSTGRES_USER)",
                 "-schemas=flyway_analytics", "-defaultSchema=flyway_analytics", "-locations=filesystem:/flyway/sql/analytics",
                 "-connectRetries=10", "-cleanDisabled=true", "migrate"]
          env:
            - {name: POSTGRES_DB, valueFrom: {secretKeyRef: {name: verabank-env, key: POSTGRES_DB}}}
            - {name: POSTGRES_USER, valueFrom: {secretKeyRef: {name: verabank-env, key: POSTGRES_USER}}}
            - {name: FLYWAY_PASSWORD, valueFrom: {secretKeyRef: {name: verabank-env, key: POSTGRES_PASSWORD}}}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: analytics, mountPath: /flyway/sql/analytics, readOnly: true}
      containers:
        - name: grants
          image: postgres:16.16
          command: ["sh", "-c", "PGPASSWORD=\"$POSTGRES_PASSWORD\" exec psql -X -q -h postgres -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -v ON_ERROR_STOP=1 -f /sql/grants.sql"]
          env:
            - {name: POSTGRES_DB, valueFrom: {secretKeyRef: {name: verabank-env, key: POSTGRES_DB}}}
            - {name: POSTGRES_USER, valueFrom: {secretKeyRef: {name: verabank-env, key: POSTGRES_USER}}}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: verabank-env, key: POSTGRES_PASSWORD}}}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 128Mi}
          volumeMounts:
            - {name: grants, mountPath: /sql, readOnly: true}
      volumes:
        - {name: core, configMap: {name: migrations-core}}
        - {name: audit, configMap: {name: migrations-audit}}
        - {name: risk, configMap: {name: migrations-risk}}
        - {name: analytics, configMap: {name: migrations-analytics}}
        - {name: grants, configMap: {name: db-grants}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: bootstrap
  labels: {app: bootstrap}
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app: bootstrap}
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: topics
          image: apache/kafka:4.3.2
          command: ["/bin/bash", "-c", "until /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1; do sleep 3; done; exec /bin/bash /scripts/create-topics.sh"]
          env:
            - {name: BOOTSTRAP_SERVER, value: "kafka:9092"}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: topics, mountPath: /scripts, readOnly: true}
      containers:
        - name: seed
          image: postgres:16.16
          command: ["sh", "/seed/seed.sh"]
          env:
            - {name: PGHOST, value: postgres}
            - {name: POSTGRES_DB, valueFrom: {secretKeyRef: {name: verabank-env, key: POSTGRES_DB}}}
            - {name: POSTGRES_USER, valueFrom: {secretKeyRef: {name: verabank-env, key: POSTGRES_USER}}}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: verabank-env, key: POSTGRES_PASSWORD}}}
            - {name: VERABANK_TRANSFER_PASSWORD, valueFrom: {secretKeyRef: {name: verabank-env, key: VERABANK_TRANSFER_PASSWORD}}}
            - {name: RISK_SVC_PASSWORD, valueFrom: {secretKeyRef: {name: verabank-env, key: RISK_SVC_PASSWORD}}}
            - {name: METABASE_DB_PASSWORD, valueFrom: {secretKeyRef: {name: verabank-env, key: METABASE_DB_PASSWORD}}}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 128Mi}
          volumeMounts:
            - {name: seed, mountPath: /seed, readOnly: true}
      volumes:
        - {name: topics, configMap: {name: kafka-topics}}
        - {name: seed, configMap: {name: seed-data}}
