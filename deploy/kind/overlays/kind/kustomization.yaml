# Overlay kind: transfer-service y Metabase por NodePort, que deploy/kind/cluster.yaml publica en el host
# (127.0.0.1:18080 y 127.0.0.1:13000). Imágenes propias con la etiqueta dev, cargadas con kind load (sin registro).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target: {kind: Service, name: transfer-service}
    patch: |-
      - op: add
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
  - target: {kind: Service, name: metabase}
    patch: |-
      - op: add
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30300
