[project]
name = "verabank-sim"
version = "0.1.0"
description = "Simulador de VeraBank: rail interbancario simulado (y, más adelante, caos, replay y AML)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "confluent-kafka>=2.5",
    "httpx>=0.27",
    "jsonschema>=4.22",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verabank_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Por defecto no corre la integración (necesita Kafka): se pide con `-m integration`.
addopts = "-ra -m 'not integration'"
markers = [
    "integration: requiere Kafka en marcha (make test-rail-it); falla, no se omite, si no está",
]
